# Fly.io — for an always-on PAID deployment, not a free one. Fly dropped its
# free tier in 2024: new signups get a 2-hour / 7-day trial, then a card is
# required and it is pay-as-you-go (~$2-5/mo for an app this size). The live
# deployment is on Render's free tier (render.yaml); this file is here for
# whoever wants no cold-sleep and is willing to pay for it.
# `flyctl launch` picks this up automatically; `flyctl deploy` after that.
# Fly assigns its own internal port via $PORT, which the Dockerfile's CMD
# already reads (${PORT:-8000}), so internal_port here just has to match.
app = "rooftop-solar-detection"
primary_region = "bom"          # Mumbai — closest to the project's own AOIs;
                                 # change to whichever region is closest to you

[build]

[http_service]
  internal_port = 8000
  force_https = true
  auto_stop_machines = "stop"   # scales to zero when idle — this is what
  auto_start_machines = true    # keeps a demo on the free allowance cheap
  min_machines_running = 0

[[http_service.checks]]
  interval = "30s"
  timeout = "5s"
  grace_period = "10s"
  method = "GET"
  path = "/api/health"

[env]
  RSOLAR_RATE_LIMIT = "30/3600"

[[vm]]
  memory = "512mb"
  cpu_kind = "shared"
  cpus = 1
